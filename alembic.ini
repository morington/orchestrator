[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# DSN берётся из STORAGE__URL (см. alembic/env.py); этот плейсхолдер не используется напрямую.
sqlalchemy.url = postgresql+asyncpg://orchestrator:orchestrator@localhost:5432/orchestrator

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
